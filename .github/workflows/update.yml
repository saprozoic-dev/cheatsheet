name: Update Epicenter

# Every hour: pull Holoscope (Knut's Gap Tracker, v1 API), re-run the sims, rebuild the page.
# Runs at 13 minutes past each hour (GitHub's busiest moment is :00). GitHub may
# start scheduled runs a few minutes late; that's normal.
on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch: {}        # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ["sim/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy
        run: pip install numpy

      - name: Pull the tracker
        env:
          # Free key from https://holoscope.app/developers, saved in this repo's
          # Settings -> Secrets and variables -> Actions as GAP_API_KEY. Never put it in a file.
          GAP_API_KEY: ${{ secrets.GAP_API_KEY }}
        run: |
          mkdir -p build && cp sim/* build/
          cd build && python3 pull.py pull.json

      - name: Run the sims and build the page
        run: |
          cd build && sh run_all.sh pull.json ../state/prev_state.json
          cat merge.log | tail -n 3 || true

      - name: Publish
        run: |
          mkdir -p state
          cp build/bankroll-table.html index.html
          cp build/new_state.json state/prev_state.json
          cp build/pull.json state/last_pull.json
          git config user.name "epicenter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html state/
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "Auto update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
